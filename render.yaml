# Experimental free deployment: memory capacity has NOT been verified on Render.
# Local model RSS was ~528 MiB. See README before attempting public deployment.
services:
  - type: web
    name: locallens-python
    runtime: python
    plan: free
    buildCommand: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: BIND_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
